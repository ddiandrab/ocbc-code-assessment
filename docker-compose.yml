services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: transfers
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
  mock-bank:
    build: ./mock-bank
    ports:
      - "9090:9090"
  transfer-service:
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/transfers
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/transfers
      ACME_ACCOUNTS_URL: http://mock-bank:9090
      ACME_FX_URL: http://mock-bank:9090
      ACME_FRAUD_URL: http://mock-bank:9090
      ACME_CORE_URL: http://mock-bank:9090
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-bank:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      
  web-client:
    build: ./web-client
    ports:
      - "8081:8081"
    depends_on:
      transfer-service:
        condition: service_healthy